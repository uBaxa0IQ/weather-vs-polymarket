services:
  db:
    image: timescale/timescaledb:latest-pg16
    container_name: weather-timescale
    environment:
      POSTGRES_DB: weather_analyzer
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - weather_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d weather_analyzer"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
  backend:
    build:
      context: ./backend
    container_name: weather-backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/weather_analyzer
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ./backend/app:/app/app
      - ./backend/sql:/app/sql
    restart: unless-stopped
  worker:
    build:
      context: ./backend
    container_name: weather-worker
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/weather_analyzer
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "-m", "app.worker"]
    restart: unless-stopped
  frontend:
    build:
      context: ./frontend
    container_name: weather-frontend
    environment:
      VITE_API_BASE_URL: http://backend:8000
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      - backend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    restart: unless-stopped

volumes:
  weather_db_data:
